# Dependências, lint, formatação e testes do backend — Tarefas: T022, T037
#
# ⚠️ ESTE É O ARQUIVO QUE A VERCEL LÊ. Não o `requirements.txt`.
#
# Descoberto no log do primeiro deploy que funcionou até o fim:
#
#     Using Python 3.12 from backend/pyproject.toml
#     Installing required dependencies from pyproject.toml...
#     Build Completed in /vercel/output [2s]
#
# Existindo um `pyproject.toml`, a Vercel instala a partir dele e **ignora o
# `requirements.txt`**. Como este arquivo tinha só `[tool.*]` e nenhum
# `[project.dependencies]`, ela instalou zero pacotes — daí o build em 2 segundos
# e a função morrendo no primeiro `import fastapi`, com o 500 mudo
# `FUNCTION_INVOCATION_FAILED`.
#
# Por isso as dependências moram aqui agora, e o `requirements.txt` foi removido:
# duas listas para a mesma coisa é garantia de que uma vai ficar para trás, e a
# que ficaria para trás é a que roda em produção.
#
# Instalar local:  uv pip install -r pyproject.toml

[project]
name = "synapse-erp-api"
version = "0.1.0"
description = "Backend da Plataforma Financeira Synapse (ERP interno v1)"
requires-python = ">=3.12,<3.13"

dependencies = [
  # ── API ──────────────────────────────────────────────────────────────────
  "fastapi>=0.115,<0.130",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",

  # ── Banco ────────────────────────────────────────────────────────────────
  # SQLAlchemy no modo Core, sem ORM (Princípio I).
  "SQLAlchemy>=2.0.36,<2.1",
  "asyncpg>=0.30,<0.31",

  # ── Autenticação ─────────────────────────────────────────────────────────
  # O projeto assina o token com ES256 (JWKS). `cryptography` NÃO é opcional:
  # sem ela o PyJWT não valida ES256.
  "PyJWT>=2.10,<3",
  "cryptography>=44,<47",

  # ── Cliente HTTP ─────────────────────────────────────────────────────────
  # Serve ao JWKS, às fontes de câmbio (RN-12) e ao Storage do Supabase.
  "httpx>=0.28,<0.29",

  # ── Domínio ──────────────────────────────────────────────────────────────
  "python-dateutil>=2.9,<3",

  # ── Upload multipart (FR-013, anexos) ────────────────────────────────────
  "python-multipart>=0.0.18,<0.1",
]

# `ofxparse` (T134) e `reportlab` (T120) ficam FORA até serem usados de verdade em
# B5/B6. Nenhum código os importa hoje, e os dois arrastam dependências pesadas —
# ofxparse traz lxml e beautifulsoup4; reportlab traz pillow. O pacote da função
# tem tamanho limitado (plan.md §Constraints).

[project.optional-dependencies]
# Não vão para a função da Vercel — só para trabalhar no projeto.
# Instalar:  uv pip install -r pyproject.toml --extra dev
dev = [
  "uvicorn>=0.32,<0.40",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.7",
  "black>=24",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "migracoes"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes — pega import não usado e nome inexistente
  "I",    # isort — ordem dos imports
  "B",    # bugbear — armadilhas comuns
  "UP",   # pyupgrade
  "ASYNC",# await esquecido, chamada bloqueante dentro de async
  "T20",  # print/pprint esquecido (constituição, Princípio III)
]
ignore = [
  # Fica para o black resolver; não faz sentido as duas ferramentas brigarem.
  "E501",
  # UP017 manda trocar `timezone.utc` por `datetime.UTC`, que é mais curto — e só
  # existe no Python 3.11+. Local rodamos 3.12, mas o runtime da Vercel nem sempre
  # é o mesmo, e um `ImportError` no import do módulo vira 500 mudo em produção
  # (FUNCTION_INVOCATION_FAILED), sem dizer o que houve. `timezone.utc` funciona
  # em toda versão. Economia de 8 caracteres não paga esse risco.
  "UP017",
]

[tool.ruff.lint.flake8-bugbear]
# B008 ("não chame função no default do argumento") é a regra certa em geral e
# falso positivo aqui: `Depends()`/`Query()`/`Header()` no default **é** a forma
# como o FastAPI declara dependência e parâmetro. Silenciar B008 inteira esconderia
# o caso legítimo (default mutável de verdade), então a exceção é só para estas.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Form",
  "fastapi.File",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integracao: precisa de um Postgres real (quickstart.md §6)",
  "contrato: confere a resposta contra os arquivos de contracts/",
  "lento: popula milhares de linhas para medir SC-007/SC-002 (T097). Rode sob demanda",
]
# Silencia o aviso de escopo do pytest-asyncio; o padrão (function) é o que queremos.
asyncio_default_fixture_loop_scope = "function"
